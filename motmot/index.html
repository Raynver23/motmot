
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Monthsary, Babe! 💗</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- Background flowers -->
    <div class="flowers flower-top-left">✿</div>
    <div class="flowers flower-top-right">❀</div>
    <div class="flowers flower-bottom-left">❀</div>
    <div class="flowers flower-bottom-right">✿</div>

    <!-- Falling petals appear here -->
    <div id="petals"></div>

    <!-- Main monthsary card -->
    <main class="container">

        <p class="top-text">A LITTLE SOMETHING FOR YOU</p>

        <div class="card">

            <div class="hearts">♡ ♥ ♡</div>

            <p class="subtitle">To my favorite person</p>

            <h1>
                Happy Monthsary
                <span>Babe!</span>
            </h1>

            <div class="divider">
                <span></span>
                <b>♡</b>
                <span></span>
            </div>

            <p class="message">
                I love you so much.
            </p>

            <p class="signature">
                - Raynver pogi
            </p>

            <button id="loveButton">
                Click for a little surprise ♡
            </button>

            <p id="surprise" class="surprise">
                No matter what happens, I'll keep choosing you. 💗
            </p>

        </div>

        <p class="footer">
            made with love, just for you ✿
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
